[project]
name = "homekeep"
version = "0.1.0"
description = "Voice-first appliance care for elders: hackathon release (H)."
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2",
    "boto3>=1.35",
    "PyJWT[crypto]>=2.9",
    # 1.x maintenance line: handshake-era protocol up to 2025-11-25. Not 2.x (spec 2026-07-28).
    "mcp==1.29.1",
    # 1.55.0 is the first release whose constraint is mcp>=1.23.0,<2.2 (PR #4151).
    "strands-agents>=1.55,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[dynamodb,s3,cognitoidp]>=5",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "httpx2>=2.13",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "DTZ", "T20", "PT", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -ra"
