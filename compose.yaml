# Local run (`make run`): the app with ENV=local against DynamoDB Local. Never used on AWS.
name: homekeep

services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ENV: local
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      # Dummy values: DynamoDB Local accepts any credentials. Real AWS is never reached locally.
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      - dynamodb-local

  dynamodb-local:
    image: amazon/dynamodb-local:3.3.1
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8001:8000"
